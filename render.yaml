# Render.com Blueprint — WildArc TMS
# Services match existing Render service names: tms-api + tms-client

services:
  # ── Backend API (Node / Express) ─────────────────────────
  - type: web
    name: tms-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node node_modules/ts-node/dist/bin.js --transpile-only src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: https://tms-client.onrender.com
      - key: APP_URL
        value: https://tms-api.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 1h
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false

  # ── Frontend (Vite Static Site) ───────────────────────────
  - type: static
    name: tms-client
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: frontend/dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://tms1-giv2.onrender.com/api
